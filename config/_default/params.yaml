favicon: "/favicon.ico"
appleTouchIcon: "/apple-touch-icon.png"
summaryLength: 0
articleWords: false
backToTop: false
viewTransitions: false

# Configurazione del Layout (Opzioni: "double" o "single")
layout:
  listMode: "single"

# Configurazione dei Colori del tema Pocket
colorScheme:
  toggle: true             # Switch chiaro/scuro visibile nell'header
  default: "auto"          # Segue le impostazioni del sistema operativo
  preset: "morandi-mist"   # Palette iniziale (es. morandi-mist, deep-sea-blue)
  showPicker: true         # Permette all'utente di cambiare palette

# Modalità Minimale testuale (Stile Bear Blog)
minMode:
  enabled: true
  default: false

# Impostazioni di lettura articoli
article:
  showListSummary: true    # Mostra l'estratto degli articoli in home
  toc: true                # Indice dei contenuti laterale/incorporato
  readingTime: true        # Tempo di lettura stimato
  backlinks: true          # Mostra le citazioni ad altri articoli
  backlinksLimit: 5

# Configurazione della Ricerca Locale del tema
search:
  provider: "local"
  fullText: false          # Imposta su true per cercare dentro il testo completo dell'articolo



######################## custom scripts & styles ####################

# Add custom assets relative to /static or via https
#logo_on_white: "/img/logo-b.svg"
#logo_on_black: "/img/logo-w.svg"
custom_js: []
custom_css: []

######################## custom config ####################

### default social share image (can also be set per lang) ###
images: ["/img/tnl-social-share.png"]

github:
  repo_url: "https://github.com/username/repo/blob/master"
  show_edit_link: false

social_links:
  devstats: ""
  discord: ""
  facebook: ""
  flickr: ""
  github: "https://github.com/TheNeetpiqLab"
  instagram: "https://www.instagram.com/the_neetpiq_lab/"
  youtube: "https://www.youtube.com/@TheNeetpiqLab"
  bluesky: "https://bsky.app/profile/theneetpiqlab.bsky.social"
  landscape: ""
  linkedin: ""
  mastodon: ""
  pinterest: ""
  rss: ""
  slack: ""
  stackoverflow: ""
  threads: ""
  

# Makes the header sticky on tall screens
sticky_header: true
# Enable search in header UI
show_search: true
